# Artifact glob patterns produced by ct-ng CT_TARBALL_RESULT for
# gnu-ruyisdk 0.20260625.0. The amd64 build runs natively on the
# builder (no HOST- prefix); arm64 and riscv64 are cross builds
# (HOST-aarch64-linux-gnu- / HOST-riscv64-linux-gnu- prefix).
#
# The second wildcard matches the source revision component
# (e.g. "6fdcde8c3e77") which varies across builds of the same
# datestamp.

[artifacts.amd64]
globs = ["RuyiSDK-*-RuyiSDK-Sources-*-riscv64-ruyisdk-linux-gnu.tar.xz"]

[artifacts.arm64]
globs = ["RuyiSDK-*-RuyiSDK-Sources-*-HOST-aarch64-linux-gnu-riscv64-ruyisdk-linux-gnu.tar.xz"]

[artifacts.riscv64]
globs = ["RuyiSDK-*-RuyiSDK-Sources-*-HOST-riscv64-linux-gnu-riscv64-ruyisdk-linux-gnu.tar.xz"]
